name: Bug Report
description: Report a bug or unexpected behavior.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce the behavior, including the exact command(s) used.
      placeholder: |
        1. Run `python run_benchmark.py --dataset Cifar10 ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error messages
      description: Paste any relevant logs or tracebacks.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, PyTorch version, GPU, OS.
      placeholder: |
        - Python: 3.8
        - PyTorch: 1.10.2
        - GPU: RTX 3090
        - OS: Ubuntu 20.04
    validations:
      required: true
